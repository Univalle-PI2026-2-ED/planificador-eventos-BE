  /api/gestiones/{id}/reprogramar/:
    post:
      operationId: gestiones_reprogramar_create
      description: |-
        Mueve la gestión al día `fecha` (y opcionalmente cambia `hora` y `horas`) y la deja en estado **pendiente**.

        Antes de mover, suma las horas de las gestiones del usuario que ya están ese día (sin contar las `hecho` ni la gestión que se mueve) más las horas de esta gestión. Si el total pasa el límite diario configurado por el usuario (`PreferenciasUsuario.limite_horas`) responde **409** con `fecha`, `horas` (total del día con esta gestión), `limite`, `exceso` y `gestiones` (las que ya cuentan ese día) dentro de `error.details`, y no guarda nada.

        Para mover igual aunque se pase del límite, el frontend usa el PATCH genérico `/api/gestiones/<id>/`, que no valida el límite.
      summary: Reprogramar una gestión cuidando el límite diario
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este gestion.
        required: true
      tags:
      - gestiones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reprogramar'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reprogramar'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reprogramar'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gestion'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
          description: Fecha faltante o inválida, u horas fuera de 0,5–8.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
          description: Falta el token de autenticación.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
          description: La gestión no existe o no es del usuario.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictoRespuesta'
              examples:
                DíaSobrecargado:
                  value:
                    success: false
                    error:
                      status: 409
                      message: Ese día superaría tu límite de horas diario.
                      details:
                        fecha: '2026-10-12'
                        horas: 7.5
                        limite: 6.0
                        exceso: 1.5
                        gestiones:
                        - id: 14
                          nombre: Confirmar catering
                          fecha: '2026-10-12'
                          hora: 09:00:00
                          horas: '4.00'
                          estado: pendiente
                          nota: ''
                          evento:
                            id: 3
                            nombre: Boda de Ana y Luis
                  summary: Día sobrecargado
          description: El día destino superaría el límite de horas.
  /api/health/:
    get:
      operationId: health_retrieve
      summary: Estado de la API
      tags:
      - health
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/hoy/:
    get:
      operationId: hoy_retrieve
      description: 'Devuelve las gestiones de los eventos del usuario autenticado
        en tres grupos: **vencidas** (días anteriores, o de hoy con la hora ya pasada),
        **para_hoy** (hoy, hora aún por llegar) y **proximas** (fechas futuras). Los
        grupos se arman por posición en el tiempo, sin importar el estado filtrado.'
      summary: Gestiones del usuario agrupadas por urgencia
      parameters:
      - in: query
        name: dias
        schema:
          type: integer
        description: Entero >= 1. Limita las próximas a los siguientes N días.
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - hecho
          - pendiente
          - pospuesto
          - todas
          default: pendiente
        description: Estado de las gestiones a incluir.
      - in: query
        name: orden
        schema:
          type: string
          enum:
          - esfuerzo
          - hora
          default: hora
        description: '''hora'': por fecha y hora. ''esfuerzo'': más horas estimadas
          primero.'
      tags:
      - hoy
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoyRespuesta'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
          description: Filtro con valor no válido.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
          description: Falta el token de autenticación.
  /api/preferencias/:
