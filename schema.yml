          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    AuthRespuesta:
      type: object
      properties:
        token:
          type: string
          description: 'Úsalo en el header: Authorization: Token <token>'
        user:
          $ref: '#/components/schemas/Usuario'
      required:
      - token
      - user
    ConflictoError:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        details:
          $ref: '#/components/schemas/ConflictoSobrecargaDetalle'
      required:
      - details
      - message
      - status
    ConflictoRespuesta:
      type: object
      properties:
        success:
          type: boolean
          default: false
        error:
          $ref: '#/components/schemas/ConflictoError'
      required:
      - error
    ConflictoSobrecargaDetalle:
      type: object
      properties:
        fecha:
          type: string
          format: date
          description: Día destino que se pasaría del límite.
        horas:
          type: number
          format: double
          description: Horas que tendría ese día con la gestión incluida.
        limite:
          type: number
          format: double
          description: Límite de horas al día que se aplicó.
        exceso:
          type: number
          format: double
          description: 'Horas que se pasa: horas - limite.'
        gestiones:
          type: array
          items:
            $ref: '#/components/schemas/GestionHoy'
          description: Gestiones que ya cuentan ese día (sin incluir la que se mueve).
      required:
      - exceso
      - fecha
      - gestiones
      - horas
      - limite
    ErrorDetalle:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
          description: Errores por campo, o 'detail' en errores generales.
      required:
      - details
      - message
      - status
    ErrorRespuesta:
      type: object
      properties:
        success:
          type: boolean
          default: false
        error:
          $ref: '#/components/schemas/ErrorDetalle'
      required:
      - error
    EstadoEnum:
      enum:
      - pendiente
      - hecho
      - pospuesto
      type: string
      description: |-
        * `pendiente` - Pendiente
        * `hecho` - Hecho
        * `pospuesto` - Pospuesto
    Evento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 200
        fecha:
          type: string
          format: date
          description: Fecha del evento (YYYY-MM-DD)
        gestiones:
          type: array
          items:
            $ref: '#/components/schemas/GestionEvento'
        gestiones_hechas:
          type: integer
          readOnly: true
          description: Cantidad de gestiones cuyo estado es hecho.
        total_gestiones:
          type: integer
          readOnly: true
          description: Cantidad total de gestiones del evento, incluidas las pospuestas.
        progreso_porcentaje:
          type: number
          format: double
          readOnly: true
          description: Porcentaje de gestiones completadas, de 0 a 100.
      required:
      - fecha
      - gestiones
      - gestiones_hechas
      - id
      - nombre
      - progreso_porcentaje
      - total_gestiones
    EventoResumen:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 200
      required:
      - id
      - nombre
    Gestion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 200
        fecha:
          type: string
          format: date
          description: Día en que se hará la gestión (YYYY-MM-DD)
        hora:
          type: string
          format: time
          description: Hora de la gestión (HH:MM)
        horas:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          description: Horas estimadas que tomará (entre 0.5 y 8)
        estado:
          $ref: '#/components/schemas/EstadoEnum'
        nota:
          type: string
        fecha_cierre:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Fecha de cierre
      required:
      - fecha
      - fecha_cierre
      - hora
      - horas
      - id
      - nombre
    GestionEvento:
      type: object
      description: |-
        Gestión dentro de un evento. Acepta 'id' para editar una gestión que
        ya existe; sin 'id' se crea una nueva.
      properties:
        id:
          type: integer
        nombre:
          type: string
          maxLength: 200
        fecha:
          type: string
          format: date
          description: Día en que se hará la gestión (YYYY-MM-DD)
        hora:
          type: string
          format: time
          description: Hora de la gestión (HH:MM)
        horas:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          description: Horas estimadas que tomará (entre 0.5 y 8)
        estado:
          $ref: '#/components/schemas/EstadoEnum'
        nota:
          type: string
        fecha_cierre:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Fecha de cierre
      required:
      - fecha
      - fecha_cierre
      - hora
      - horas
      - nombre
    GestionHoy:
      type: object
      description: Gestión con el evento embebido, como lo usa Hoy.jsx (g.evento.id
        / g.evento.nombre).
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 200
        fecha:
          type: string
          format: date
          description: Día en que se hará la gestión (YYYY-MM-DD)
        hora:
          type: string
          format: time
          description: Hora de la gestión (HH:MM)
        horas:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          description: Horas estimadas que tomará (entre 0.5 y 8)
        estado:
          $ref: '#/components/schemas/EstadoEnum'
        nota:
          type: string
        evento:
          allOf:
          - $ref: '#/components/schemas/EventoResumen'
          readOnly: true
      required:
      - evento
      - fecha
      - hora
      - horas
      - id
      - nombre
    HoyFiltros:
      type: object
      properties:
        estado:
          type: string
        orden:
          type: string
        dias:
          type: integer
          nullable: true
      required:
      - dias
      - estado
      - orden
    HoyGrupos:
      type: object
      properties:
        vencidas:
          type: array
          items:
            $ref: '#/components/schemas/GestionHoy'
        para_hoy:
          type: array
          items:
            $ref: '#/components/schemas/GestionHoy'
        proximas:
          type: array
          items:
            $ref: '#/components/schemas/GestionHoy'
      required:
      - para_hoy
      - proximas
      - vencidas
    HoyRespuesta:
      type: object
      properties:
        fecha:
          type: string
          format: date
        hora:
          type: string
          description: HH:MM, hora local usada para clasificar.
        filtros:
          $ref: '#/components/schemas/HoyFiltros'
        resumen:
          $ref: '#/components/schemas/HoyResumen'
        grupos:
          $ref: '#/components/schemas/HoyGrupos'
      required:
      - fecha
      - filtros
      - grupos
      - hora
      - resumen
    HoyResumen:
      type: object
      properties:
        vencidas:
          type: integer
        para_hoy:
          type: integer
        proximas:
          type: integer
      required:
      - para_hoy
      - proximas
      - vencidas
    Login:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - password
    PatchedEvento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 200
        fecha:
          type: string
          format: date
          description: Fecha del evento (YYYY-MM-DD)
        gestiones:
          type: array
          items:
            $ref: '#/components/schemas/GestionEvento'
        gestiones_hechas:
          type: integer
          readOnly: true
          description: Cantidad de gestiones cuyo estado es hecho.
        total_gestiones:
          type: integer
          readOnly: true
          description: Cantidad total de gestiones del evento, incluidas las pospuestas.
        progreso_porcentaje:
          type: number
          format: double
          readOnly: true
          description: Porcentaje de gestiones completadas, de 0 a 100.
    PatchedGestion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 200
        fecha:
          type: string
          format: date
          description: Día en que se hará la gestión (YYYY-MM-DD)
        hora:
          type: string
          format: time
          description: Hora de la gestión (HH:MM)
        horas:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          description: Horas estimadas que tomará (entre 0.5 y 8)
        estado:
          $ref: '#/components/schemas/EstadoEnum'
        nota:
          type: string
        fecha_cierre:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Fecha de cierre
    PatchedPreferencias:
      type: object
      properties:
        limite_horas:
          type: number
          format: double
          maximum: 12
          minimum: 1
    Preferencias:
      type: object
      properties:
        limite_horas:
          type: number
          format: double
          maximum: 12
          minimum: 1
      required:
      - limite_horas
    Registro:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Dirección de correo electrónico
          maxLength: 254
        password:
          type: string
          writeOnly: true
      required:
      - email
      - id
      - password
      - username
    Reprogramar:
      type: object
      description: Datos para mover una gestión a otro día.
      properties:
        fecha:
          type: string
          format: date
          description: Día destino (YYYY-MM-DD)
        hora:
          type: string
          format: time
          description: Nueva hora (HH:MM). Si se omite, conserva la actual.
        horas:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          description: Nuevas horas estimadas (0,5 a 8). Si se omite, conserva las
            actuales.
      required:
      - fecha
    Usuario:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
      required:
      - email
      - id
      - username
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
