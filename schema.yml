          description: Falta el token de autenticación.
    patch:
      operationId: preferencias_partial_update
      description: Cambia el límite de horas al día (entre 1 y 12, pasos de 0.5 en
        el formulario).
      summary: Actualizar preferencias del usuario
      tags:
      - preferencias
      requestBody:
