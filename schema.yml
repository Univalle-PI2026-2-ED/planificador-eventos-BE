openapi: 3.0.3
info:
  title: Planificador de Eventos API
  version: 1.0.0
  description: API REST del Organizador de Eventos Independientes
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Valida las credenciales y devuelve el token del usuario. Si son
        incorrectas, el mensaje llega en error.details.non_field_errors.
      summary: Iniciar sesión
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRespuesta'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
          description: Credenciales incorrectas o campos faltantes.
  /api/auth/registro/:
    post:
      operationId: auth_registro_create
      description: Crea una cuenta y devuelve su token, así el usuario queda con la
        sesión iniciada. La contraseña se valida con las reglas de Django (mínimo
        8 caracteres, no demasiado común, no solo números).
      summary: Registrar usuario
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registro'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Registro'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Registro'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRespuesta'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
          description: Usuario o correo repetido, contraseña débil o campos faltantes.
  /api/eventos/:
    get:
      operationId: eventos_list
      description: |-
        GET/POST /api/eventos/
        GET/PATCH/PUT/DELETE /api/eventos/<id>/
        POST /api/eventos/<id>/subtareas/

        Cada usuario solo ve y modifica sus propios eventos.

        **Editar el plan:** en PATCH/PUT, `gestiones` es opcional. Cada elemento
        con `id` edita esa gestión del evento; cada elemento sin `id` crea una
        gestión nueva (nombre, fecha, hora y horas son obligatorios). Las
        gestiones que no se mencionan no se tocan; para borrar una se usa
        DELETE /api/gestiones/<id>/.
      tags:
      - eventos
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evento'
          description: ''
    post:
      operationId: eventos_create
      description: |-
        GET/POST /api/eventos/
        GET/PATCH/PUT/DELETE /api/eventos/<id>/
        POST /api/eventos/<id>/subtareas/

        Cada usuario solo ve y modifica sus propios eventos.

        **Editar el plan:** en PATCH/PUT, `gestiones` es opcional. Cada elemento
        con `id` edita esa gestión del evento; cada elemento sin `id` crea una
        gestión nueva (nombre, fecha, hora y horas son obligatorios). Las
        gestiones que no se mencionan no se tocan; para borrar una se usa
        DELETE /api/gestiones/<id>/.
      tags:
      - eventos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Evento'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Evento'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Evento'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
          description: ''
  /api/eventos/{id}/:
    get:
      operationId: eventos_retrieve
      description: |-
        GET/POST /api/eventos/
        GET/PATCH/PUT/DELETE /api/eventos/<id>/
